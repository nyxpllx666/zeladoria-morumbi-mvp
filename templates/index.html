<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeladoria Morumbi - Denúncia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Requisito de Acessibilidade: Área de toque mínima */
        .btn, .form-control, .form-select { min-height: 44px; }
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container mt-4" style="max-width: 500px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Associação Morumbi</h2>
            <p class="text-muted">Registre problemas no bairro rapidamente.</p>
        </div>
        <div class="card shadow-sm">
            <div class="card-body">
                <form action="/enviar" method="POST">
                    <div class="mb-3">
                        <label for="categoria" class="form-label fw-bold">Categoria do Problema</label>
                        <select class="form-select" id="categoria" name="categoria" required>
                            <option value="">Selecione...</option>
                            {% for cat in categorias %}
                            <option value="{{ cat }}">{{ cat }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="endereco" class="form-label fw-bold">Endereço do Local</label>
                        <input type="text" class="form-control" id="endereco" name="endereco" placeholder="Ex: Av. Mário Filho, em frente ao nº 1500" required>
                    </div>
                    <div class="mb-3">
                        <label for="descricao" class="form-label fw-bold">Descrição (Opcional)</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="3" placeholder="Detalhes do problema..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark w-100 fw-bold fs-5">Enviar Denúncia</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
