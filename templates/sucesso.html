<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denúncia Recebida</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn { min-height: 44px; }
        body { background-color: #f8f9fa; }
    </style>
</head>
<body>
    <div class="container mt-5 text-center" style="max-width: 500px;">
        <div class="card shadow border-success">
            <div class="card-body py-5">
                <h1 class="display-1 text-success mb-3">✓</h1>
                <h2 class="fw-bold text-dark">Denúncia Recebida!</h2>
                <p class="fs-5 text-muted mt-3">Sua ocorrência foi encaminhada à Associação de Moradores do Morumbi.</p>
                <div class="alert alert-success fw-bold fs-4 my-4">
                    Protocolo: #{{ protocolo }}
                </div>
                <a href="/" class="btn btn-outline-dark w-100 fw-bold fs-5">Registrar Nova Denúncia</a>
            </div>
        </div>
    </div>
</body>
</html>
