<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Associação Morumbi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .btn, .form-select { min-height: 44px; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">Painel Administrativo - Morumbi</span>
            <span class="text-white">Usuário: Diretoria</span>
        </div>
    </nav>
    <div class="container-fluid px-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold">Ocorrências Registradas</h3>
            <button class="btn btn-primary fw-bold px-4">Gerar Relatório PDF</button>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Protocolo</th>
                                <th>Data</th>
                                <th>Categoria</th>
                                <th>Endereço</th>
                                <th>Descrição</th>
                                <th>Status</th>
                                <th>Ação</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for oc in ocorrencias %}
                            <tr>
                                <td>{{ oc.protocolo }}</td>
                                <td>{{ oc.data }}</td>
                                <td><span class="badge bg-secondary">{{ oc.categoria }}</span></td>
                                <td>{{ oc.endereco }}</td>
                                <td>{{ oc.descricao }}</td>
                                <td><span class="badge bg-primary fs-6">{{ oc.status }}</span></td>
                                <td><button class="btn btn-sm btn-outline-dark">Alterar Status</button></td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
